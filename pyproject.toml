[project]
name = "mlops"
version = "0.1.0"
description = "Learning MLOps with Airflow and MLflow, running locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
