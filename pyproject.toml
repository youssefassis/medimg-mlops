[project]
name = "mlops"
version = "0.1.0"
description = "Learning project: Airflow, MLflow and continual learning for medical imaging."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
lint = [
    "pre-commit==4.6.2",
    "ruff==0.16.9",
]
test = [
    "pytest>=9,<10",
]

[tool.uv]
default-groups = ["lint", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
