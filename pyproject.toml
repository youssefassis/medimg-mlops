[project]
name = "mlops"
version = "0.1.0"
description = "Learning MLOps with Airflow and MLflow, running locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"
