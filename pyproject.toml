[project]
name = "mlops"
version = "0.1.0"
description = "Learning MLOps with Airflow and MLflow, running locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow==3.16.1",
    "pydicom>=3.0.2,<4",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.9.1,<2",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<1",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
notebooks = [
    "marimo>=0.25.1,<0.26",
    "matplotlib>=3.11.2,<4",
    "pandas>=3.0.6,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

# On Linux (CI, Docker), install the CPU-only PyTorch builds instead of the CUDA ones.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.per-file-ignores]
# marimo displays a cell's last expression, and markdown tables can't be wrapped.
"notebooks/*" = ["B018", "E501"]
