# Used by the promote step. A model gets the production alias only if it passes every rule,
# using its metrics on the test set at the threshold chosen on validation. The minimums also
# apply to each view (AP, PA) and sex. Training aims its threshold at min_recall.
model_name: pneumonia-classifier
min_recall: 0.90
min_specificity: 0.80
# Recall, specificity and ROC AUC may be at most this much below the production model's,
# if both were scored on the same test set. Otherwise only the minimums apply.
max_drop: 0.01
