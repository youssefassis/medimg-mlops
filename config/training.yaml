# Used by scripts/train.py. data_dir is relative to the project root.
data_dir: data
batch: 1 # trains on data/batches/batch_1.csv up to batch_<batch>.csv
val_fraction: 0.15 # share of the patients held out for validation
epochs: 5
batch_size: 32
learning_rate: 0.0001
seed: 42
device: cuda # a PyTorch device
experiment: pneumonia
